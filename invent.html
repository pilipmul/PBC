<!DOCTYPE html>

<head>
  <script>
    (function() {
      try {
        // 1. Ambil data session dari localStorage
        const session = localStorage.getItem("user");
        
        // 2. Jika session kosong, kembalikan ke login
        if (!session) {
          window.location.replace("https://pilipmul.github.io/SOT/login.html");
          return;
        }

        const userData = JSON.parse(session);
        
        // 3. Jika struktur userData tidak valid
        if (!userData) {
          window.location.replace("https://pilipmul.github.io/SOT/login.html");
          return;
        }

        // 4. Jika ada objek akses, periksa apakah akun memiliki hak akses
        if (userData.akses) {
          const aks = userData.akses;
          // Memeriksa izin dari berbagai kemungkinan nama atribut (inventory/log/acces)
          const punyaAkses = (aks.inventory === "Y" || aks.log === "Y" || aks.acces === "Y" || aks.accesControl === "Y");
          
          if (!punyaAkses) {
            alert("Anda tidak memiliki hak akses ke modul Inventory.");
            window.location.replace("https://pilipmul.github.io/SOT/login.html");
          }
        }
      } catch (err) {
        console.error("Autentikasi gagal:", err);
        window.location.replace("https://pilipmul.github.io/SOT/login.html");
      }
    })();
  </script>

  <script>
    const SUPABASE_URL = 'https://sfblelnbczlvykqemhtm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9k7sUNqlqhRqjkUtSNpFPQ_VAspSZT0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PAGE_SIZE = 200;
    let currentPage = 1;
    let totalRows = 0;
    let rawDataMap = new Map();
    let fetchedData = [];

    // Cache database suggestions
    let dbUsersList = [];
    let dbItemsList = [];

    // Filter & Sort States
    let activeFilterColumn = null;
    let filterSelections = {}; 
    let sortConfig = { column: null, direction: null };

    document.addEventListener('DOMContentLoaded', () => {
      fetchTableData();
      preloadSuggestions();
    
      // MENDENGARKAN PERUBAHAN DATA SECARA REALTIME
      _supabase
        .channel('public:inventory')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, (payload) => {
          fetchTableData();
        })
        .subscribe();
    });
    
    // Toggle Menu Hamburger Dropdown
    function toggleMainMenu(event) {
      event.stopPropagation();
      const menu = document.getElementById('mainMenuDropdown');
      menu.classList.toggle('hidden');
    }

    function closeMainMenu() {
      document.getElementById('mainMenuDropdown').classList.add('hidden');
    }

    // Close popovers & suggestion lists when clicking outside
    document.addEventListener('click', (e) => {
      const mainDropdown = document.getElementById('mainMenuDropdown');
      if (mainDropdown && !mainDropdown.classList.contains('hidden') && !mainDropdown.contains(e.target) && !e.target.closest('#btnHamburger')) {
        closeMainMenu();
      }

      const popover = document.getElementById('filterPopover');
      if (!popover.classList.contains('hidden') && !popover.contains(e.target) && !e.target.closest('button[onclick*="toggleFilterMenu"]')) {
        closeFilterPopover();
      }

      if (!e.target.closest('#inputUser') && !e.target.closest('#userSuggestList')) {
        document.getElementById('userSuggestList').classList.add('hidden');
      }
      if (!e.target.closest('#inputItem') && !e.target.closest('#itemSuggestList')) {
        document.getElementById('itemSuggestList').classList.add('hidden');
      }
    });

    // Load master users & items data for quick suggestion search
    async function preloadSuggestions() {
      try {
        const [usersRes, itemsRes] = await Promise.all([
          _supabase.from('users').select('nama').order('nama', { ascending: true }),
          _supabase.from('item').select('item').order('item', { ascending: true })
        ]);

        if (usersRes.data) {
          dbUsersList = Array.from(new Set(usersRes.data.map(u => u.nama).filter(Boolean)));
        }
        if (itemsRes.data) {
          dbItemsList = Array.from(new Set(itemsRes.data.map(i => i.item).filter(Boolean)));
        }
      } catch (err) {
        console.error('Gagal mengambil data referensi saran:', err);
      }
    }

    // Auto-suggest handlers for User
    function handleUserSuggest() {
      const inputVal = document.getElementById('inputUser').value.trim().toLowerCase();
      const listEl = document.getElementById('userSuggestList');
      
      if (!inputVal) {
        listEl.classList.add('hidden');
        listEl.innerHTML = '';
        return;
      }

      const filtered = dbUsersList.filter(name => name.toLowerCase().includes(inputVal));

      if (filtered.length === 0) {
        listEl.classList.add('hidden');
        return;
      }

      listEl.innerHTML = '';
      filtered.forEach(name => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'px-3 py-1.5 hover:bg-indigo-600 hover:text-white text-slate-200 cursor-pointer transition';
        itemDiv.innerText = name;
        itemDiv.onclick = () => {
          document.getElementById('inputUser').value = name;
          listEl.classList.add('hidden');
        };
        listEl.appendChild(itemDiv);
      });

      listEl.classList.remove('hidden');
    }

    // Auto-suggest handlers for Item
    function handleItemSuggest() {
      const inputVal = document.getElementById('inputItem').value.trim().toLowerCase();
      const listEl = document.getElementById('itemSuggestList');
      
      if (!inputVal) {
        listEl.classList.add('hidden');
        listEl.innerHTML = '';
        return;
      }

      const filtered = dbItemsList.filter(item => item.toLowerCase().includes(inputVal));

      if (filtered.length === 0) {
        listEl.classList.add('hidden');
        return;
      }

      listEl.innerHTML = '';
      filtered.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'px-3 py-1.5 hover:bg-indigo-600 hover:text-white text-slate-200 cursor-pointer transition';
        itemDiv.innerText = item;
        itemDiv.onclick = () => {
          document.getElementById('inputItem').value = item;
          listEl.classList.add('hidden');
        };
        listEl.appendChild(itemDiv);
      });

      listEl.classList.remove('hidden');
    }

    async function fetchTableData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-slate-400">Memuat data...</td></tr>`;

      try {
        const { count, error: countErr } = await _supabase
          .from('inventory')
          .select('*', { count: 'exact', head: true });
        
        if (countErr) throw countErr;
        totalRows = count || 0;

        if (totalRows === 0) {
          tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-slate-400">Belum ada transaksi.</td></tr>`;
          updatePaginationUI();
          return;
        }

        const totalPages = Math.ceil(totalRows / PAGE_SIZE);
        if (currentPage > totalPages) currentPage = totalPages;

        const fromIndex = Math.max(0, totalRows - (currentPage * PAGE_SIZE));
        const toIndex = totalRows - ((currentPage - 1) * PAGE_SIZE) - 1;

        const { data, error } = await _supabase
          .from('inventory')
          .select('*')
          .order('no', { ascending: true })
          .range(fromIndex, toIndex);

        if (error) throw error;

        fetchedData = data || [];
        rawDataMap.clear();
        fetchedData.forEach(row => rawDataMap.set(row.no, row));

        renderTable();

      } catch (err) {
        alert('Gagal mengambil data: ' + err.message);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let processedData = fetchedData.filter(row => {
        for (const colKey in filterSelections) {
          const selectedValues = filterSelections[colKey];
          if (selectedValues && selectedValues.length > 0) {
            const rowVal = String(row[colKey] ?? '-').toLowerCase();
            const match = selectedValues.some(val => val.toLowerCase() === rowVal);
            if (!match) return false;
          }
        }
        return true;
      });

      if (sortConfig.column && sortConfig.direction) {
        processedData.sort((a, b) => {
          let valA = a[sortConfig.column] ?? '';
          let valB = b[sortConfig.column] ?? '';

          if (typeof valA === 'number' && typeof valB === 'number') {
            return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
          }

          valA = String(valA).toLowerCase();
          valB = String(valB).toLowerCase();

          if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
          if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }

      if (processedData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-slate-400">Tidak ada data yang sesuai filter.</td></tr>`;
        updatePaginationUI();
        return;
      }

      processedData.forEach(row => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/30 border-b border-slate-700/50 text-slate-300';
        
        const projectText = row.project ? escapeHtml(row.project) : 'Edit';
        const projectBtn = `<button onclick="openModalForNo(${row.no})" title="Edit Transaksi #${row.no}" class="w-full px-1.5 py-0.5 bg-indigo-600/30 hover:bg-indigo-600/60 text-indigo-300 hover:text-white rounded border border-indigo-500/40 text-[11px] truncate transition">${projectText}</button>`;

        tr.innerHTML = `
          <td class="p-2 text-center font-mono text-slate-400">${row.no}</td>
          <td class="p-2 truncate" title="${escapeHtml(row.user || '')}">${escapeHtml(row.user || '-')}</td>
          <td class="p-2 font-medium text-white break-words">${escapeHtml(row.item || '-')}</td>
          <td class="p-2 text-center text-emerald-400 font-medium">${row.in ?? ''}</td>
          <td class="p-2 text-center text-rose-400 font-medium">${row.out ?? ''}</td>
          <td class="p-2 font-mono text-slate-400 truncate">${escapeHtml(row.date || '-')}</td>
          <td class="p-2 text-slate-400 break-words">${escapeHtml(row.note || '-')}</td>
          <td class="p-2 font-mono text-slate-400 break-all">${escapeHtml(row.trx_code || '-')}</td>
          <td class="p-2 text-center text-slate-200 bg-slate-800/40 font-semibold">${row.balance ?? '-'}</td>
          <td class="p-2 text-center bg-slate-800/20">${projectBtn}</td>
        `;
        
        tbody.appendChild(tr);
      });

      updatePaginationUI();
    }

    function toggleFilterMenu(columnKey, event) {
      event.stopPropagation();
      activeFilterColumn = columnKey;
      
      const popover = document.getElementById('filterPopover');
      const rect = event.currentTarget.getBoundingClientRect();
    
      // Hitung posisi horizontal agar tidak terpotong di kiri maupun kanan layar
      let leftPos = rect.left + window.scrollX - 100;
      
      // Batasi agar minimal 8px dari tepi kiri layar
      if (leftPos < 8) leftPos = 8;
      
      // Batasi agar tidak melampaui tepi kanan layar
      const maxLeft = window.innerWidth - 250;
      if (leftPos > maxLeft) leftPos = maxLeft;
    
      popover.style.top = `${rect.bottom + window.scrollY + 4}px`;
      popover.style.left = `${leftPos}px`;
      
      document.getElementById('filterSearchInput').value = '';
      document.getElementById('selectAllCheckbox').checked = true;
    
      renderFilterCheckboxes();
      popover.classList.remove('hidden');
    }

    function closeFilterPopover() {
      document.getElementById('filterPopover').classList.add('hidden');
    }

    function renderFilterCheckboxes() {
      const container = document.getElementById('filterItemsList');
      const searchVal = document.getElementById('filterSearchInput').value.toLowerCase();
      container.innerHTML = '';

      if (!activeFilterColumn) return;

      const uniqueValues = Array.from(new Set(fetchedData.map(r => String(r[activeFilterColumn] ?? '-'))));
      const activeSelections = filterSelections[activeFilterColumn] || uniqueValues;

      const filteredValues = uniqueValues.filter(val => val.toLowerCase().includes(searchVal));

      if (filteredValues.length === 0) {
        container.innerHTML = `<span class="text-slate-500 italic text-[11px] block p-1">Item tidak ditemukan</span>`;
        return;
      }

      filteredValues.forEach(val => {
        const isChecked = activeSelections.includes(val);
        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 text-slate-300 hover:text-white cursor-pointer text-[11px] truncate';
        label.innerHTML = `
          <input type="checkbox" value="${escapeHtml(val)}" ${isChecked ? 'checked' : ''} 
                 class="filter-item-checkbox rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0" />
          <span class="truncate" title="${escapeHtml(val)}">${escapeHtml(val)}</span>
        `;
        container.appendChild(label);
      });
    }

    function toggleSelectAllFilters(isChecked) {
      const checkboxes = document.querySelectorAll('.filter-item-checkbox');
      checkboxes.forEach(cb => cb.checked = isChecked);
    }

    function applyFilter() {
      const checkboxes = document.querySelectorAll('.filter-item-checkbox:checked');
      const selected = Array.from(checkboxes).map(cb => cb.value);

      filterSelections[activeFilterColumn] = selected;
      renderTable();
      closeFilterPopover();
    }

    function clearFilterColumn() {
      delete filterSelections[activeFilterColumn];
      renderTable();
      closeFilterPopover();
    }

    function applySort(direction) {
      sortConfig = { column: activeFilterColumn, direction: direction };
      renderTable();
      closeFilterPopover();
    }

    function updatePaginationUI() {
      const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;
      const startNo = Math.max(1, totalRows - (currentPage * PAGE_SIZE) + 1);
      const endNo = totalRows - ((currentPage - 1) * PAGE_SIZE);

      document.getElementById('pageInfo').innerText = 
        `Menampilkan ${startNo} - ${Math.max(startNo, endNo)} dari ${totalRows}`;

      document.getElementById('jumpPageInput').value = currentPage;
      document.getElementById('jumpPageInput').max = totalPages;
      document.getElementById('totalPagesText').innerText = `/ ${totalPages}`;

      document.getElementById('btnPrev').disabled = currentPage >= totalPages;
      document.getElementById('btnNext').disabled = currentPage <= 1;
    }

    function changePage(direction) {
      currentPage += direction;
      fetchTableData();
    }

    function jumpToPage() {
      const inputEl = document.getElementById('jumpPageInput');
      let targetPage = parseInt(inputEl.value);
      const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;

      if (isNaN(targetPage) || targetPage < 1) targetPage = 1;
      if (targetPage > totalPages) targetPage = totalPages;

      currentPage = targetPage;
      fetchTableData();
    }

    function openModalForNo(no) {
      const row = rawDataMap.get(no);
      if (row) {
        openModal('edit', row);
      }
    }

    function openModal(mode, row = null) {
      document.getElementById('inventoryForm').reset();
      document.getElementById('editNo').value = '';
      document.getElementById('userSuggestList').classList.add('hidden');
      document.getElementById('itemSuggestList').classList.add('hidden');
      
      const deleteBtn = document.getElementById('btnDeleteInModal');

      if (mode === 'edit' && row) {
        document.getElementById('modalTitle').innerText = 'Edit Transaksi #' + row.no;
        document.getElementById('editNo').value = row.no;
        document.getElementById('inputUser').value = row.user || '';
        document.getElementById('inputItem').value = row.item || '';
        document.getElementById('inputIn').value = row.in !== null && row.in !== undefined ? row.in : '';
        document.getElementById('inputOut').value = row.out !== null && row.out !== undefined ? row.out : '';
        document.getElementById('inputDate').value = row.date || '';
        document.getElementById('inputTrxCode').value = row.trx_code || '';
        document.getElementById('inputNote').value = row.note || '';
        
        deleteBtn.classList.remove('hidden');
      } else {
        document.getElementById('modalTitle').innerText = 'Tambah Transaksi Baru';
        deleteBtn.classList.add('hidden');
      }

      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    async function saveData(e) {
      e.preventDefault();
      const no = document.getElementById('editNo').value;
      const user = document.getElementById('inputUser').value;
      const item = document.getElementById('inputItem').value;
      const inVal = document.getElementById('inputIn').value;
      const outVal = document.getElementById('inputOut').value;
      const date = document.getElementById('inputDate').value;
      const trx_code = document.getElementById('inputTrxCode').value;
      const note = document.getElementById('inputNote').value;

      const payload = {
        user: user || null,
        item: item,
        in: inVal !== '' ? parseInt(inVal) : null,
        out: outVal !== '' ? parseInt(outVal) : null,
        date: date || null,
        trx_code: trx_code || null,
        note: note || null
      };

      try {
        if (no) {
          const { error } = await _supabase
            .from('inventory')
            .update(payload)
            .eq('no', no);
          if (error) throw error;
        } else {
          const { error } = await _supabase
            .from('inventory')
            .insert([payload]);
          if (error) throw error;
        }

        closeModal();
        fetchTableData();
      } catch (err) {
        alert('Gagal menyimpan data: ' + err.message);
      }
    }

    async function deleteDataInModal() {
      const no = document.getElementById('editNo').value;
      if (!no) return;

      if (!confirm(`Apakah Anda yakin ingin menghapus transaksi #${no}?`)) return;

      try {
        const { error } = await _supabase
          .from('inventory')
          .delete()
          .eq('no', no);
          
        if (error) throw error;

        closeModal();
        fetchTableData();
      } catch (err) {
        alert('Gagal menghapus data: ' + err.message);
      }
    }

    async function exportCSV() {
      try {
        const { data, error } = await _supabase
          .from('inventory')
          .select('*')
          .order('no', { ascending: true });

        if (error) throw error;
        if (!data || data.length === 0) {
          alert('Tidak ada data untuk diunduh');
          return;
        }

        const headers = ['no', 'user', 'item', 'in', 'out', 'date', 'note', 'trx_code', 'balance', 'project'];
        const csvRows = [headers.join(',')];

        data.forEach(row => {
          const values = headers.map(header => {
            const val = row[header] ?? '';
            return `"${String(val).replace(/"/g, '""')}"`;
          });
          csvRows.push(values.join(','));
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + csvRows.join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `inventory_all_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      } catch (err) {
        alert('Gagal mengunduh CSV: ' + err.message);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
