<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PBC SyncFlow</title> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/pilipmul/PBC-cek-Piutang/main/Logo%201.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #3b82f6;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 30px -10px rgba(37, 99, 235, 0.12);
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            margin: 0; 
            padding: 32px 16px; 
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.7) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(224, 231, 255, 0.7) 0px, transparent 50%);
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            background: var(--card-bg); 
            padding: 28px 24px; 
            border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: var(--shadow-md); 
            position: relative; 
            text-align: center; 
        }

        /* Header Navigation Bar */
        .header-actions { 
            position: relative; 
            height: 44px; 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
        }

        #refreshBtn, #hamburgerBtn { 
            background: #ffffff; 
            border: 1.5px solid var(--border-color); 
            width: 38px; 
            height: 38px; 
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #refreshBtn:hover, #hamburgerBtn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        #refreshBtn { position: relative; left: 0; }
        #hamburgerBtn { position: relative; right: 0; }

        #gaIndicator { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff; 
            font-weight: 800; 
            font-size: 11px; 
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
            display: none; 
            pointer-events: none; 
        }

        /* Hero Brand Card */
        .brand-hero {
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            border: 1.5px solid #dbeafe;
            border-radius: 20px;
            padding: 18px 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.8);
        }

        #titleBtn { 
            width: 100%; 
            max-width: 230px; 
            filter: drop-shadow(0 4px 6px rgba(37, 99, 235, 0.1));
            transition: transform 0.2s; 
            user-select: none; 
            -webkit-user-drag: none; 
        }

        #titleBtn:hover {
            transform: scale(1.02);
        }

        /* Form Controls & Layout */
        .form-section-title {
            text-align: left;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin: 0 0 8px 4px;
        }

        #nameWrapper { 
            position: relative; 
            background: #ffffff;
            border-radius: 14px;
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        #nameWrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input, textarea { 
            width: 100%; 
            padding: 8px 12px; 
            border: none; 
            font-size: 0.95rem; 
            color: var(--text-main);
            background-color: transparent; 
            text-align: center; 
            height: 44px; 
            line-height: 1.2; 
            display: block; 
            resize: none; 
            font-weight: 600;
        }

        input:focus, textarea:focus { outline: none; }
        
        input::placeholder, textarea::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        input.item { 
            overflow: hidden; 
            text-overflow: clip; 
            white-space: nowrap; 
            text-align: left;
            padding-left: 12px;
        }
        
        input.item:not(:placeholder-shown):not(:focus) { animation: marquee 10s linear infinite; }
        @keyframes marquee { 0% { text-indent: 100%; } 100% { text-indent: -100%; } }

        .clear-btn { 
            position: absolute; 
            right: 10px; 
            top: 50%; 
            transform: translateY(-50%); 
            background: #f1f5f9; 
            color: #64748b; 
            border-radius: 50%; 
            width: 22px; 
            height: 22px; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            cursor: pointer; 
            z-index: 10; 
            font-weight: bold; 
            transition: all 0.2s;
        }
        
        .clear-btn:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        #nameWrapper:focus-within input:not(:placeholder-shown) ~ .clear-btn, 
        .item-row div:first-child:focus-within input:not(:placeholder-shown) ~ .clear-btn { 
            display: flex; 
        }

        /* Item Row Design (Card-Style) */
        .item-row { 
            display: grid; 
            grid-template-columns: 44% 22% 34%; 
            gap: 6px; 
            align-items: center; 
            margin-bottom: 12px; 
            background: #f8fafc;
            padding: 8px; 
            border-radius: 16px;
            border: 1.5px solid var(--border-color);
            position: relative; 
            transition: all 0.2s ease;
        }

        .item-row:focus-within {
            background: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
        }

        .qty-wrapper { 
            position: relative; 
            display: grid; 
            place-items: center; 
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            height: 42px; 
        }

        .stock-overlay { 
            grid-area: 1/1; 
            font-size: 1rem; 
            font-weight: 800; 
            color: var(--danger); 
            pointer-events: none; 
            display: none; 
            z-index: 1; 
        }

        input.qty { 
            grid-area: 1/1; 
            position: relative; 
            z-index: 2; 
            background: transparent !important; 
            padding: 0; 
            -moz-appearance: textfield; 
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        
        input.qty::-webkit-outer-spin-button, 
        input.qty::-webkit-inner-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        input.qty.hide-placeholder::placeholder { color: transparent; }

        textarea.desc { 
            overflow-y: hidden; 
            padding: 10px 24px 10px 10px; 
            height: 42px;
            font-size: 0.82rem;
            text-align: left;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .delete-row { 
            position: absolute; 
            top: 50%; 
            right: 12px; 
            transform: translateY(-50%);
            background: #fee2e2; 
            border: none; 
            color: var(--danger); 
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-weight: bold; 
            cursor: pointer; 
            font-size: 0.9rem; 
            padding: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            opacity: 0.8; 
            transition: all 0.2s;
        }

        .delete-row:hover {
            opacity: 1;
            background: var(--danger);
            color: #ffffff;
        }

        #itemContainer .item-row:first-child .delete-row { display: none; }

        /* Actions Footer */
        .btn-group { 
            display: flex; 
            gap: 12px; 
            margin-top: 20px; 
            justify-content: center; 
            position: relative; 
            align-items: center; 
        }

        button { 
            flex: 1; 
            height: 48px;
            padding: 0 16px; 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: #fff; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 0.95rem; 
            letter-spacing: 0.5px;
            cursor: pointer; 
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease; 
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled { 
            background: #cbd5e1; 
            box-shadow: none;
            cursor: not-allowed; 
        }

        .add-row { 
            background-color: transparent; 
            border: none; 
            width: auto; 
            padding: 8px; 
            flex: none; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: none; /* <-- TAMBAHKAN INI */
        }

        .add-row:hover {
            background: var(--primary-light);
            border-style: solid;
        }

        .out {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }

        .out:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        #btnIn { 
            opacity: 0.25; 
            pointer-events: none; 
        }

        /* Autocomplete List */
        .autocomplete-list { 
            position: absolute; 
            background: #ffffff; 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            z-index: 2000; 
            max-height: 200px; 
            overflow-y: auto; 
            width: 100%; 
            box-shadow: var(--shadow-lg); 
            text-align: left; 
            display: none; 
            top: 48px; 
            left: 0; 
        }

        .autocomplete-item { 
            padding: 12px 16px; 
            cursor: pointer; 
            font-size: 0.9rem;
            color: var(--text-main);
            border-bottom: 1px solid #f1f5f9; 
            transition: background 0.15s;
        }

        .autocomplete-item:hover { 
            background: var(--primary-light); 
            color: var(--primary); 
            font-weight: 600;
        }

        /* Popups & Modals */
        .popup-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.45); 
            backdrop-filter: blur(6px);
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 6000; 
        }

        .popup-box { 
            background: #ffffff; 
            border-radius: 24px; 
            padding: 28px 24px; 
            width: 90%; 
            max-width: 340px; 
            text-align: center; 
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .modal-btn { 
            width: auto; 
            min-width: 110px; 
            margin: 0; 
            display: inline-block; 
            padding: 12px 20px; 
        }

        #successMode { 
            background: #fef9c3; 
            font-weight: 800; 
            padding: 6px 18px; 
            border-radius: 20px; 
            margin-bottom: 16px; 
            display: inline-block; 
            color: #854d0e; 
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .popup-toast { 
            position: fixed; 
            top: 24px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #0f172a; 
            color: #fff; 
            padding: 12px 24px; 
            border-radius: 30px; 
            display: none; 
            z-index: 7000; 
            width: fit-content; 
            max-width: 90%; 
            white-space: nowrap; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
            pointer-events: none; 
            font-weight: 600; 
            font-size: 0.88rem;
        }

        .dropdown-menu { 
            position: absolute; 
            top: 48px; 
            right: 0; 
            background: #ffffff; 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            display: none; 
            flex-direction: column; 
            box-shadow: var(--shadow-lg); 
            pointer-events: auto; 
            min-width: 150px; 
            overflow: hidden;
        }

        .dropdown-item { 
            padding: 12px 18px; 
            font-size: 0.88rem; 
            cursor: pointer; 
            color: var(--text-main); 
            font-weight: 600; 
            text-align: left; 
            border-bottom: 1px solid #f1f5f9; 
            transition: background 0.15s;
        }

        .dropdown-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .dropdown-item:last-child { border-bottom: none; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 0.8s linear infinite; }
        
        #historyPopup { 
            position: absolute; 
            top: 48px; 
            right: 0; 
            background-color: #ffffff; 
            border: 1px solid var(--border-color); 
            border-radius: 18px; 
            width: 310px; 
            max-height: 400px; 
            overflow-y: auto; 
            padding: 0; 
            display: none; 
            text-align: left; 
            box-shadow: var(--shadow-lg); 
            z-index: 5000; 
        }

        .history-header { 
            position: sticky; 
            top: 0; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(4px);
            padding: 14px 16px; 
            z-index: 10; 
            border-bottom: 1px solid #f1f5f9; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            min-height: 50px; 
        }

        #historySearchInput { 
            display: none; 
            width: 85%; 
            height: 34px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 0 12px; 
            font-size: 0.85rem; 
            text-align: left; 
            background: #f8fafc; 
        }

        #searchToggleBtn { 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
        }
        
        #historyList { padding: 8px 12px 12px 12px; }

        #loaderOverlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(4px);
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
        }

        .loader { 
            border: 4px solid #e2e8f0; 
            border-top: 4px solid var(--primary); 
            border-radius: 50%; 
            width: 46px; 
            height: 46px; 
            animation: spin 0.8s linear infinite; 
        }

        .history-item { 
            padding: 12px; 
            border-bottom: 1px solid #f1f5f9; 
            cursor: pointer; 
            border-radius: 10px;
            transition: background 0.15s; 
        }

        .history-item:hover { background: #f8fafc; }

        .history-detail { 
            display: none; 
            padding: 12px; 
            background: var(--primary-light); 
            font-size: 0.82rem; 
            color: var(--text-main); 
            border-radius: 10px; 
            margin-top: 8px; 
            text-align: left; 
            line-height: 1.5; 
            border: 1px solid #dbeafe; 
        }
    </style>
</head>
<body>
<div id="loaderOverlay"><div class="loader"></div></div>
<div class="container">
    <div id="popupToast" class="popup-toast"></div>
    <div class="header-actions">
        <button id="refreshBtn" onclick="fetchDataAndUpdateUI()">
            <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="#2563eb"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
        </button>
        <div id="gaIndicator">GA MODE</div> 
        <button id="hamburgerBtn" onclick="toggleDropdown(event)">
            <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="#2563eb"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
        </button>
        <div id="myDropdown" class="dropdown-menu">
            <div class="dropdown-item" onclick="toggleGAMode()">GA Mode</div>
            <div id="btnHistoryGA" class="dropdown-item" style="display:none;" onclick="toggleHistoryPopup(event)">~50 Trx</div>
        </div>
    </div>

    <div id="historyPopup">
        <div class="history-header">
            <h4 id="historyTitle" style="margin:0; color:var(--primary); font-weight:800; font-size:0.95rem;">~50 Transaksi</h4>
            <input type="text" id="historySearchInput" placeholder="Cari transaksi..." oninput="filterHistory()">
            <div id="searchToggleBtn" onclick="toggleHistorySearch(event)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18px" height="18px" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
        <div id="historyList"></div>
    </div>

    <div class="brand-hero">
        <img id="titleBtn" src="https://raw.githubusercontent.com/pilipmul/PBC-cek-Piutang/c917d70c8d2a8f1630b8dd1400a2d13c2aa55d65/Title%20PBC%20B.png" alt="PBC SyncFlow">
    </div>

    <form id="myForm">
        <div class="form-section-title">Identitas Pengguna</div>
        <div id="nameWrapper">
            <input type="text" id="name" placeholder="Pilih atau ketik Nama..." autocomplete="off" required>
            <div class="clear-btn" onmousedown="clearInput(event, this)">×</div>
            <div id="nameList" class="autocomplete-list"></div>
        </div>

        <div class="form-section-title">Daftar Barang &amp; Qty</div>
        <div id="itemContainer">
            <div class="row-3col item-row">
                <div style="position: relative;">
                    <input type="text" class="item" placeholder="Item" autocomplete="off" required>
                    <div class="clear-btn" onmousedown="clearInput(event, this)">×</div>
                    <div class="autocomplete-list"></div>
                </div>
                <div class="qty-wrapper">
                    <span class="stock-overlay"></span>
                    <input type="number" class="qty" min="1" placeholder="Qty" required>
                </div>
                <div style="position: relative;">
                    <textarea class="desc" placeholder="Notes" onmousedown="startLongPress(event, this)" onmouseup="cancelLongPress()" onmouseleave="cancelLongPress()" ontouchstart="startLongPress(event, this)" ontouchend="cancelLongPress()"></textarea>
                    <button type="button" class="delete-row">×</button>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="in" id="btnIn">IN</button>
            <button type="button" class="add-row" id="addRow">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2563eb"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
            </button>
            <button type="button" class="out" id="btnOut">OUT</button>
        </div>
    </form>
</div>

<div id="confirmPopup" class="popup-overlay">
    <div class="popup-box">
        <h3 id="confirmTitle" style="color:var(--primary); margin-top:0; font-size:1.25rem; font-weight:800;"></h3>
        <div id="confirmItems" style="text-align:left; margin-bottom:24px; font-size:0.9rem; line-height:1.6; background:#f8fafc; padding:12px 16px; border-radius:12px; border:1px solid var(--border-color);"></div>
        <div class="btn-group" style="margin-top:0;">
            <button class="modal-btn" id="finalSubmitBtn">POST</button>
            <button class="modal-btn" onclick="closeConfirmPopup()" style="background:#64748b; box-shadow:none;">CANCEL</button>
        </div>
    </div>
</div>

<div id="successPopup" class="popup-overlay">
    <div class="popup-box">
        <div id="successMode"></div>
        <div id="successItems" style="text-align:left; margin-bottom:20px; font-size:0.9rem; line-height:1.6; background:#f8fafc; padding:12px 16px; border-radius:12px; border:1px solid var(--border-color);"></div>
        <button class="modal-btn" onclick="closeSuccessPopup()">Close</button>
    </div>
</div>

<div id="descPopup" class="popup-overlay">
    <div class="popup-box">
        <textarea id="descPopupInput" style="width:100%; height:120px; border:1.5px solid var(--border-color); border-radius:14px; margin-bottom:16px; text-align: left; padding:12px; font-size:0.9rem; background:#f8fafc;"></textarea>
        <button class="modal-btn" onclick="saveDescPopup()">Save</button>
    </div>
</div>

<div id="passPopup" class="popup-overlay">
    <div class="popup-box">
        <h4 style="margin:0 0 16px 0; color:var(--text-main); font-size:1.05rem;">Masukkan Password Admin</h4>
        <input type="password" id="adminPass" placeholder="Password" style="border:1.5px solid var(--border-color); border-radius:14px; margin-bottom:20px; height:46px; background:#f8fafc;">
        <div class="btn-group" style="margin-top:0;">
            <button class="modal-btn" onclick="checkPassword()">OK</button>
            <button class="modal-btn" onclick="closePassPopup()" style="background:#64748b; box-shadow:none;">Batal</button>
        </div>
    </div>
</div>

<script>
    // 1. Konfigurasi Supabase Client
    const SUPABASE_URL = 'https://sfblelnbczlvykqemhtm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9k7sUNqlqhRqjkUtSNpFPQ_VAspSZT0';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let nameData = [], itemData = [], itemStock = {}, lastTransactions = [];
    let gaMode = false, activeTextarea = null, longPressTimer, passAction = "", currentMode = "", currentItems = [], currentName = "";

    function clearInput(e, btn) { 
        e.preventDefault(); 
        const inp = btn.parentElement.querySelector('input'); 
        inp.value = ''; 
        const list = btn.parentElement.querySelector('.autocomplete-list'); 
        if(list) list.style.display = 'none'; 
        inp.focus(); 
    }

    function startLongPress(e, el) { 
        activeTextarea = el; 
        longPressTimer = setTimeout(() => { 
            document.getElementById("descPopupInput").value = el.value; 
            document.getElementById("descPopup").style.display = "flex"; 
            document.getElementById("descPopupInput").focus(); 
        }, 600); 
    }

    function cancelLongPress() { clearTimeout(longPressTimer); }

    function saveDescPopup() { 
        if (activeTextarea) activeTextarea.value = document.getElementById("descPopupInput").value; 
        document.getElementById("descPopup").style.display = "none"; 
    }

    function toggleDropdown(e) { 
        e.stopPropagation(); 
        const d = document.getElementById("myDropdown"); 
        d.style.display = (d.style.display === "flex") ? "none" : "flex"; 
    }

    function toggleGAMode() { 
        document.getElementById("myDropdown").style.display = "none"; 
        if (!gaMode) { 
            passAction = "ga"; 
            document.getElementById("passPopup").style.display = "flex"; 
            document.getElementById("adminPass").focus(); 
        } else { 
            updateGAUI(false); 
        } 
    }

    function updateGAUI(status) { 
        gaMode = status; 
        document.getElementById("gaIndicator").style.display = gaMode ? "block" : "none"; 
        document.getElementById("btnHistoryGA").style.display = gaMode ? "block" : "none"; 
        const btnIn = document.getElementById("btnIn"); 
        if (gaMode) { 
            btnIn.style.opacity = "1"; 
            btnIn.style.pointerEvents = "auto"; 
        } else { 
            btnIn.style.opacity = "0.25"; 
            btnIn.style.pointerEvents = "none"; 
        } 
        initAutocomplete(); 
    }

    // Ambil Data Nama, Item, & Riwayat dari Supabase
    async function fetchDataAndUpdateUI() { 
        const icon = document.getElementById("refreshIcon"); 
        if(icon) icon.classList.add("spinning"); 
        try { 
            // 1. Ambil Nama Pengguna dari tabel "users"
            const { data: usersData, error: errUsers } = await supabaseClient.from('users').select('nama');
            if (errUsers) throw errUsers;
            nameData = usersData ? usersData.map(u => u.nama).filter(Boolean) : [];

            // 2. Ambil Item & Balance dari tabel "item"
            const { data: itemsData, error: errItems } = await supabaseClient.from('item').select('item, balance');
            if (errItems) throw errItems;
            itemData = [];
            itemStock = {};
            if (itemsData) {
                itemsData.forEach(i => {
                    if (i.item) {
                        itemData.push(i.item);
                        itemStock[i.item] = i.balance || 0;
                    }
                });
            }

            // 3. Ambil 50 Transaksi Terakhir dari tabel "inventory" (Kolom: user & note)
            const { data: invData, error: errInv } = await supabaseClient
                .from('inventory')
                .select('user, in, out, item, date, note')
                .order('no', { ascending: false })
                .limit(50);
            
            if (errInv) throw errInv;
            
            lastTransactions = invData ? invData.map(i => {
                const mode = (i.in && i.in > 0) ? 'in' : 'out';
                const qty = mode === 'in' ? i.in : i.out;
                return [i.user || '', mode, qty || 0, i.item || '', i.date || '', i.note || ''];
            }) : [];

            initAutocomplete(); 
        } catch (e) { 
            console.error(e);
            showToast("❌ Sync Error"); 
        } finally { 
            if(icon) icon.classList.remove("spinning"); 
        } 
    }

    function initAutocomplete() { 
        setupAutocomplete(document.getElementById("name"), document.getElementById("nameList"), nameData); 
        document.querySelectorAll(".item-row").forEach(row => { 
            setupAutocomplete(row.querySelector(".item"), row.querySelector(".autocomplete-list"), itemData, true, row.querySelector(".stock-overlay"), row.querySelector(".qty")); 
        }); 
    }

    function setupAutocomplete(input, box, data, isItem=false, overlay=null, qtyInput=null) { 
        const updateOverlay = () => { 
            if (isItem && gaMode && itemStock[input.value.trim()] !== undefined) { 
                overlay.textContent = itemStock[input.value.trim()]; 
                overlay.style.display = qtyInput.value ? "none" : "block"; 
                qtyInput.classList.add("hide-placeholder"); 
            } else if (overlay) { 
                overlay.style.display = "none"; 
                if(qtyInput) qtyInput.classList.remove("hide-placeholder"); 
            } 
        }; 
        input.oninput = () => { 
            const val = input.value.trim().toLowerCase(); 
            updateOverlay(); 
            if (!val) { 
                box.style.display = "none"; 
                return; 
            } 
            const match = data.filter(d => d && d.toLowerCase().includes(val) && (isItem && !gaMode ? (itemStock[d] || 0) > 0 : true)).slice(0, 10); 
            box.innerHTML = match.map(m => `<div class="autocomplete-item">${m}</div>`).join(''); 
            box.style.display = match.length ? "block" : "none"; 
            box.querySelectorAll(".autocomplete-item").forEach(div => { 
                div.onclick = () => { 
                    input.value = div.textContent; 
                    box.style.display = "none"; 
                    updateOverlay(); 
                }; 
            }); 
        }; 
        if (qtyInput) qtyInput.oninput = updateOverlay; 
    }

    async function handleSubmit(mode) { 
        currentName = document.getElementById("name").value.trim(); 
        if (!nameData.includes(currentName)) return showToast("⚠️ Pilih Nama!"); 
        
        currentItems = [...document.querySelectorAll(".item-row")].map(row => ({ 
            item: row.querySelector(".item").value.trim(), 
            qty: parseInt(row.querySelector(".qty").value), 
            desc: row.querySelector(".desc").value.trim() 
        })).filter(it => it.item && it.qty); 

        if (!currentItems.length) return showToast("⚠️ Isi Item!"); 

        currentMode = mode; 
        document.getElementById("confirmTitle").innerText = mode.toUpperCase(); 
        document.getElementById("confirmItems").innerHTML = currentItems.map(i => `- ${i.item}: <span style="color:#ef4444; font-weight:800;">${i.qty}</span>`).join('<br>'); 
        document.getElementById("confirmPopup").style.display = "flex"; 
        
        document.getElementById("finalSubmitBtn").onclick = () => { 
            document.getElementById("confirmPopup").style.display = "none"; 
            executeFinalSubmit(mode, currentName, currentItems); 
        }; 
    }

    // Kirim Data Transaksi ke Tabel "inventory" Supabase (Kolom: user & note)
    async function executeFinalSubmit(mode, name, items) { 
        document.getElementById("loaderOverlay").style.display = "flex"; 
        const todayStr = new Date().toISOString().split('T')[0];

        const rowsToInsert = items.map(i => ({
            user: name,
            item: i.item,
            in: mode === 'in' ? i.qty : null,
            out: mode === 'out' ? i.qty : null,
            note: i.desc || null,
            date: todayStr
        }));

        try { 
            const { error } = await supabaseClient.from('inventory').insert(rowsToInsert);

            if (error) {
                showToast("❌ " + error.message);
            } else { 
                showSuccessPopup(mode, items); 
                document.getElementById("myForm").reset(); 
                const container = document.getElementById("itemContainer"); 
                while(container.children.length > 1) container.removeChild(container.lastChild); 
                document.getElementById("addRow").style.visibility = "visible"; 
                fetchDataAndUpdateUI(); 
            } 
        } catch (e) { 
            showToast("❌ Connection Error"); 
        } finally { 
            document.getElementById("loaderOverlay").style.display = "none"; 
        } 
    }

    function checkPassword() { 
        if (document.getElementById("adminPass").value === "azza") { 
            document.getElementById("passPopup").style.display = "none"; 
            document.getElementById("adminPass").value = ""; 
            if (passAction === "in") executeFinalSubmit(currentMode, currentName, currentItems); 
            else if (passAction === "ga") updateGAUI(true); 
        } else showToast("❌ Salah!"); 
    }

    function showToast(m) { 
        const t = document.getElementById("popupToast"); 
        t.textContent = m; 
        t.style.display = "block"; 
        setTimeout(() => t.style.display="none", 2500); 
    }

    function showSuccessPopup(m, its) { 
        document.getElementById("successMode").textContent = m.toUpperCase(); 
        document.getElementById("successItems").innerHTML = its.map(i => `• ${i.item}: <span style="color:#ef4444; font-weight:800;">${i.qty}</span>`).join('<br>'); 
        document.getElementById("successPopup").style.display = "flex"; 
    }

    function closeSuccessPopup() { document.getElementById("successPopup").style.display = "none"; }
    function closeConfirmPopup() { document.getElementById("confirmPopup").style.display = "none"; }
    function closePassPopup() { document.getElementById("passPopup").style.display = "none"; }

    // Histori & Pencarian
    function toggleHistoryPopup(e) { 
        e.stopPropagation();
        const p = document.getElementById("historyPopup"); 
        if (p.style.display === "block") {
            p.style.display = "none";
            resetHistoryUI();
        } else {
            p.style.display = "block";
            renderHistory(lastTransactions);
        }
    }

    function toggleHistorySearch(e) {
        e.stopPropagation();
        const title = document.getElementById("historyTitle");
        const input = document.getElementById("historySearchInput");
        if (input.style.display === "block") {
            resetHistoryUI();
        } else {
            title.style.display = "none";
            input.style.display = "block";
            input.focus();
        }
    }

    function resetHistoryUI() {
        document.getElementById("historyTitle").style.display = "block";
        const input = document.getElementById("historySearchInput");
        input.style.display = "none";
        input.value = "";
        renderHistory(lastTransactions);
    }

    function filterHistory() {
        const val = document.getElementById("historySearchInput").value.toLowerCase();
        const filtered = lastTransactions.filter(t => 
            t[0].toLowerCase().includes(val) || 
            t[1].toLowerCase().includes(val) || 
            t[2].toString().toLowerCase().includes(val) || 
            t[3].toLowerCase().includes(val)
        );
        renderHistory(filtered);
    }

    function renderHistory(data) {
        document.getElementById("historyList").innerHTML = data.map((t, index) => `
            <div class="history-item" onclick="const det = document.getElementById('det-${index}'); det.style.display = det.style.display === 'block' ? 'none' : 'block';">
                <div style="font-size:0.85rem; display: flex; justify-content: space-between; align-items: center;">
                    <span><b>${t[0]}</b> <span style="color:${t[1]==='in'?'#10b981':'#ef4444'}; font-weight:800;">${t[1].toUpperCase()}</span></span>
                    <b style="font-family:'JetBrains Mono';">${t[2]}</b>
                </div>
                <div id="det-${index}" class="history-detail">
                    <div style="margin-top: 1px; padding-top: 1px;">
                        <b>Item:</b> ${t[3]}<br>
                        <b>Tanggal:</b> ${t[4]}<br>
                        <b>Catatan:</b> ${t[5] || '-'}
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Event Listeners
    document.getElementById("addRow").onclick = () => { 
        const container = document.getElementById("itemContainer"); 
        const btnAdd = document.getElementById("addRow"); 
        if (container.children.length < 5) { 
            const clone = container.children[0].cloneNode(true); 
            clone.querySelectorAll("input, textarea").forEach(i => i.value = ""); 
            clone.querySelector(".stock-overlay").style.display = "none"; 
            clone.querySelector(".autocomplete-list").style.display = "none"; 
            const tx = clone.querySelector("textarea.desc"); 
            tx.onmousedown = (e) => startLongPress(e, tx); 
            tx.onmouseup = cancelLongPress; 
            tx.onmouseleave = cancelLongPress; 
            tx.ontouchstart = (e) => startLongPress(e, tx); 
            tx.ontouchend = cancelLongPress; 
            container.appendChild(clone); 
            initAutocomplete(); 
            if (container.children.length === 5) btnAdd.style.visibility = "hidden"; 
        } 
    };

    document.addEventListener("click", e => { 
        if (e.target.classList.contains("delete-row")) { 
            e.target.closest(".item-row").remove(); 
            if (document.getElementById("itemContainer").children.length < 5) { 
                document.getElementById("addRow").style.visibility = "visible"; 
            } 
        } 
        if (!e.target.closest(".autocomplete-list") && !e.target.closest("input") && !e.target.closest(".clear-btn")) {
            document.querySelectorAll(".autocomplete-list").forEach(l => l.style.display = "none"); 
        }
        if (!e.target.closest("#myDropdown") && !e.target.closest("#hamburgerBtn")) {
            document.getElementById("myDropdown").style.display = "none"; 
        }
        if (!e.target.closest("#historyPopup") && !e.target.closest("#btnHistoryGA")) {
            document.getElementById("historyPopup").style.display = "none";
            resetHistoryUI();
        }
    });

    document.getElementById("btnIn").onclick = () => handleSubmit("in");
    document.getElementById("btnOut").onclick = () => handleSubmit("out");
    window.onload = fetchDataAndUpdateUI;
</script>
</body>
</html>
